[package]
name = "mcp-hub"
version = "0.2.0"
edition = "2024"
authors = ["Gleb Chipiga <gleb.chipiga@gmail.com>"]
description = "Tools-only Model Context Protocol aggregation server"
license = "MIT"
readme = "README.md"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
mimalloc = { version = "0.1", features = ["v3"], optional = true }
rmcp = {
    version = "2",
    default-features = false,
    features = [
        "client",
        "server",
        "transport-io",
        "transport-child-process",
    ],
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread", "sync", "time"] }
toml = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
